# Publishes to the VS Code Marketplace when a version tag is pushed.
#
#   npm version patch     # bumps package.json and creates the tag
#   git push --follow-tags
#
# Requires a VSCE_PAT repository secret: an Azure DevOps personal access token
# with the Marketplace "Manage" scope, issued for all accessible organizations.
name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # A tag that disagrees with the manifest would publish a version nobody
      # can trace back to a commit.
      - name: Check the tag matches the manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $MANIFEST"
            exit 1
          fi
          echo "publishing version $MANIFEST"

      - name: Package extension
        run: npx --yes @vscode/vsce package --out system-vitals.vsix

      # The same guard CI runs. systeminformation was once pruned from the
      # package, producing a build that compiled and then failed at activation.
      # Publishing that to the marketplace is not recoverable by editing a file.
      - name: Verify the runtime dependency is bundled
        run: |
          if ! unzip -l system-vitals.vsix | grep -q 'node_modules/systeminformation/lib/'; then
            echo "systeminformation is missing from the VSIX: refusing to publish"
            exit 1
          fi

      - name: Publish to the VS Code Marketplace
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT secret is not set; add it under Settings > Secrets and variables > Actions"
            exit 1
          fi
          npx --yes @vscode/vsce publish --packagePath system-vitals.vsix --pat "$VSCE_PAT"

      - name: Attach the VSIX to a GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" system-vitals.vsix --clobber

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: system-vitals-vsix
          path: system-vitals.vsix
